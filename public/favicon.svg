<!--
  Favicon — terminal prompt glyph, on-brand with the site's CLI aesthetic.
  A green ">" caret and an underscore cursor on the warm-dark bg
  (#0d1117 / #1cb03a from the design tokens). Rounded square so it reads well
  at small sizes in a browser tab.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="24" fill="#0d1117" />
  <path
    d="M34 44 L58 64 L34 84"
    fill="none"
    stroke="#1cb03a"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <rect x="68" y="80" width="30" height="9" rx="2" fill="#1cb03a" />
</svg>
