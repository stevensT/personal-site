<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" width="720" height="580" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>The life of a note</title>
<desc>Captures from the phone share sheet, an Obsidian note, or a tagged capture land in 0-Inbox. Every 15 minutes the Hermes agent processes the inbox, skipping the run when it is empty. Tagged items are filed into a PARA folder; untagged items are digested into wiki pages. Either way, the change is committed and pushed to Gitea.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="720" height="580" fill="#FFFFFF"/>

<g font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle">
<rect x="40" y="40" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<rect x="260" y="40" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<rect x="480" y="40" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="140" y="62">Share sheet</text>
<text x="360" y="62">Obsidian note</text>
<text x="580" y="62">Tagged capture</text>
</g>
<g font-size="11" fill="#534AB7" text-anchor="middle">
<text x="140" y="82">any app on the phone</text>
<text x="360" y="82">any device</text>
<text x="580" y="82">add #to/resources</text>
</g>

<g stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)">
<line x1="140" y1="96" x2="318" y2="147"/>
<line x1="360" y1="96" x2="360" y2="147"/>
<line x1="580" y1="96" x2="402" y2="147"/>
</g>

<rect x="260" y="150" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="360" y="172" font-size="14" font-weight="600" fill="#085041" text-anchor="middle">0-Inbox/</text>
<text x="360" y="192" font-size="11" fill="#0F6E56" text-anchor="middle">one drop zone</text>

<line x1="360" y1="206" x2="360" y2="257" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="220" y="260" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="360" y="282" font-size="14" font-weight="600" fill="#085041" text-anchor="middle">Hermes agent</text>
<text x="360" y="302" font-size="11" fill="#0F6E56" text-anchor="middle">every 15 min, skipped if the inbox is empty</text>

<g stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)">
<line x1="320" y1="316" x2="200" y2="397"/>
<line x1="400" y1="316" x2="520" y2="397"/>
</g>
<text x="244" y="354" font-size="11" fill="#5F5E5A" text-anchor="end">has a #to/ tag</text>
<text x="476" y="354" font-size="11" fill="#5F5E5A">no tag</text>

<g font-size="14" font-weight="600" fill="#085041" text-anchor="middle">
<rect x="60" y="400" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<rect x="400" y="400" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="190" y="422">Filed in a PARA folder</text>
<text x="530" y="422">Digested into wiki/</text>
</g>
<g font-size="11" fill="#0F6E56" text-anchor="middle">
<text x="190" y="442">title + one-line summary added</text>
<text x="530" y="442">source, entity, concept pages</text>
</g>

<g stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)">
<line x1="190" y1="456" x2="318" y2="497"/>
<line x1="530" y1="456" x2="402" y2="497"/>
</g>

<rect x="260" y="500" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="360" y="522" font-size="14" font-weight="600" fill="#444441" text-anchor="middle">Git commit</text>
<text x="360" y="542" font-size="11" fill="#5F5E5A" text-anchor="middle">pushed to Gitea</text>
</svg>
