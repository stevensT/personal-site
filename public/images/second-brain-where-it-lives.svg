<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Where everything lives</title>
<desc>Obsidian on four devices syncs through a reverse proxy to CouchDB on an agent VM. livesync-bridge mirrors CouchDB into a plain markdown folder that the Hermes agent reads and writes, and Hermes pushes history to a Gitea server.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="720" height="480" fill="#FFFFFF"/>

<rect x="20" y="20" width="680" height="110" rx="14" fill="none" stroke="#B4B2A9" stroke-dasharray="5 4"/>
<text x="36" y="44" font-size="13" font-weight="600" fill="#444441">Your devices</text>
<g font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle">
<rect x="36" y="58" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<rect x="202" y="58" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<rect x="368" y="58" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<rect x="534" y="58" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="111" y="80">Desktop</text>
<text x="277" y="80">Laptop</text>
<text x="443" y="80">MacBook</text>
<text x="609" y="80">iPhone</text>
</g>
<g font-size="11" fill="#534AB7" text-anchor="middle">
<text x="111" y="100">Obsidian + Claude Code</text>
<text x="277" y="100">Obsidian</text>
<text x="443" y="100">Obsidian</text>
<text x="609" y="100">Obsidian + share sheet</text>
</g>

<rect x="20" y="160" width="680" height="296" rx="14" fill="none" stroke="#B4B2A9" stroke-dasharray="5 4"/>
<text x="36" y="184" font-size="13" font-weight="600" fill="#444441">Home lab</text>

<line x1="125" y1="130" x2="125" y2="241" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<text x="133" y="214" font-size="11" fill="#5F5E5A">LiveSync</text>

<rect x="40" y="244" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="125" y="266" font-size="14" font-weight="600" fill="#085041" text-anchor="middle">Reverse proxy</text>
<text x="125" y="286" font-size="11" fill="#0F6E56" text-anchor="middle">notes.home.example</text>

<rect x="40" y="364" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="125" y="386" font-size="14" font-weight="600" fill="#444441" text-anchor="middle">Gitea</text>
<text x="125" y="406" font-size="11" fill="#5F5E5A" text-anchor="middle">full vault history</text>

<rect x="240" y="204" width="440" height="236" rx="12" fill="none" stroke="#0F6E56"/>
<text x="256" y="226" font-size="13" font-weight="600" fill="#085041">Agent VM</text>

<g font-size="14" font-weight="600" fill="#085041" text-anchor="middle">
<rect x="260" y="244" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<rect x="480" y="244" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<rect x="260" y="364" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<rect x="480" y="364" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="350" y="266">CouchDB</text>
<text x="570" y="266">livesync-bridge</text>
<text x="350" y="386">Hermes agent</text>
<text x="570" y="386">Vault folder</text>
</g>
<g font-size="11" fill="#0F6E56" text-anchor="middle">
<text x="350" y="286">sync hub</text>
<text x="570" y="286">database to files</text>
<text x="350" y="406">ingest + git, every 15 min</text>
<text x="570" y="406">plain .md files</text>
</g>

<line x1="210" y1="272" x2="257" y2="272" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="443" y1="272" x2="477" y2="272" stroke="#5F5E5A" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="570" y1="300" x2="570" y2="361" stroke="#5F5E5A" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
