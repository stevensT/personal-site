<line x1="260" y1="392" x2="213" y2="392" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<text x="234" y="384" font-size="11" fill="#5F5E5A" text-anchor="end">push</text>
</svg>
